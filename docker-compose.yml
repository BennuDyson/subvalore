version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: subvalore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subvalore}
      POSTGRES_USER: ${POSTGRES_USER:-subvalore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subvalore_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subvalore} -d ${POSTGRES_DB:-subvalore}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
